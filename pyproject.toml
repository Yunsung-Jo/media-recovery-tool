[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-recovery-tool"
version = "0.1.0"
description = "손상된 디스크 이미지에서 JPEG와 AVI를 카빙하고 baseline JPEG를 구조적으로 복구하는 도구"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tqdm",
    "numpy>=1.24",
    "Pillow>=10.0",
    "numba>=0.60",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.18",
    "pytest",
]

[project.scripts]
media-recovery = "media_recovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"schemas" = ["schemas/*.schema.json"]
